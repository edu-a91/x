    <style>
        /* Base Reset & Styles matching ASW Education Cute Theme */
        * {

        body {

        .section {

        /* Utility / Shape Classes */

        .back-btn-wrapper {

            left: 1.5rem;

        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 2px solid #fed7aa;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            color: #0f172a;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-home-btn i {
            color: #0284c7;
            transition: all 0.3s ease;
        }

        .back-home-btn:hover {
            background: #e0f2fe;
            border-color: #7dd3fc;
            color: #0284c7;
            transform: translateY(-2px);
        }

        .back-home-btn:hover i {
            transform: translateX(-3px);
        }

        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 3.2rem;
            height: 3.2rem;
            background-color: #0284c7;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            font-size: 1.1rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
        }

        .back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background-color: #0369a1;
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.45);
        }

        /* Cute Feedback Card Theme matching ASW style */
        .feedback-card {
            border: 3px solid #fbcfe8;
            background: linear-gradient(135deg, #fff1f2 0%, #fffaf5 100%);
            border-radius: 2.5rem;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 20px 40px -10px rgba(244, 114, 182, 0.15);
            position: relative;
            overflow: hidden;
            margin-bottom: 3rem;
            max-width: 48rem;
            margin-left: auto;
            margin-right: auto;
        }

        .feedback-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #38bdf8, #f43f5e);
        }

        .main-section-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 1.5rem;
            color: #0284c7;
            letter-spacing: -0.5px;
            position: relative;
        }

        .main-section-title span {
            color: #f43f5e;
        }

        .main-section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: #38bdf8;
            margin: 0.75rem auto 0 auto;
            border-radius: 2rem;
        }

        /* Modern Interactive Star Rating */
        .rating-wrapper {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #fed7aa;
            border-radius: 1.5rem;
            padding: 1.75rem 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .rating-wrapper:hover {
            border-color: #f43f5e;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.08);
        }

        .rating-container {
            display: inline-flex;
            flex-direction: row-reverse;
            gap: 0.75rem;
            justify-content: center;
            align-items: center;
        }

        .rating-container input {
            display: none;
        }

        .rating-container label {
            font-size: 2.4rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 2px 4px rgba(0,0,0,0.03);
        }

        .rating-container label:hover,
        .rating-container label:hover ~ label,
        .rating-container input:checked ~ label {
            color: #f59e0b;
            transform: scale(1.15) translateY(-2px);
        }

        .rating-label-text {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            color: #0284c7;
            margin-top: 0.8rem;
            min-height: 1.5rem;
            letter-spacing: 0.3px;
        }

        .form-container {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .form-control {
            width: 100%;
            background: #ffffff;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.9rem 1.1rem;
            font-size: 0.95rem;
            font-family: 'Quicksand', 'Noto Sans Sinhala', sans-serif;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 130px;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
            font-family: 'Quicksand', 'Noto Sans Sinhala', sans-serif;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer matching ASW website */

            border-top-right-radius: 2.5rem;
            box-shadow: 0 -20px 40px rgba(15, 23, 42, 0.15);
            text-align: center;
            margin-top: 5rem;
        }

        .footer-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body { padding-top: 5rem; }
            .container { padding: 0 1rem; }
            .feedback-card { padding: 2rem 1.25rem; border-radius: 2rem; margin-bottom: 2rem; }
            .main-section-title { font-size: 1.75rem; }
            .back-btn-wrapper { top: 1rem; left: 1rem; }
            .back-home-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .back-to-top { bottom: 1.5rem; right: 1.5rem; width: 3rem; height: 3rem; }
            .rating-wrapper { padding: 1.25rem 0.75rem; }
            .rating-container { gap: 0.5rem; }
            .rating-container label { font-size: 2rem; }
            .form-control { padding: 0.8rem; font-size: 0.9rem; }
        }

        @media (max-width: 320px) {
            body { padding-top: 4rem; }
            .container { padding: 0 0.6rem; }
            .feedback-card { padding: 1.25rem 0.75rem; border-radius: 1.2rem; margin-bottom: 1.5rem; border-width: 2px; }
            .main-section-title { font-size: 1.35rem; margin-top: 1.5rem; margin-bottom: 1rem; }
            .back-btn-wrapper { top: 0.75rem; left: 0.75rem; }
            .back-home-btn { padding: 0.4rem 0.75rem; font-size: 0.75rem; border-radius: 1.5rem; border-width: 1.5px; }
            .back-to-top { bottom: 1rem; right: 1rem; width: 2.4rem; height: 2.4rem; font-size: 0.85rem; }
            .rating-wrapper { padding: 1rem 0.5rem; border-radius: 1rem; border-width: 1.5px; margin-bottom: 1rem; }
            .rating-container { gap: 0.4rem; }
            .rating-container label { font-size: 1.6rem; }
            .rating-label-text { font-size: 0.8rem; margin-top: 0.5rem; }
            .form-group { margin-bottom: 1rem; }
            .form-group label { font-size: 0.85rem; margin-bottom: 0.3rem; }
            .form-control { padding: 0.7rem; font-size: 0.85rem; border-radius: 0.8rem; border-width: 1.5px; }
            textarea.form-control { min-height: 100px; }
            .btn-submit { padding: 0.8rem; font-size: 0.9rem; border-radius: 0.8rem; }
            footer { padding: 2.5rem 0.75rem 1.5rem 0.75rem; margin-top: 3rem; border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem; }
            .footer-bottom { font-size: 0.75rem; }
        }
    </style>
</head>
<body id="top">

    <!-- MAIN CONTENT SECTION -->
    <section class="section">
        <div class="container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 class="main-section-title">Student <span>Feedback</span></h1>
                <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: #e0f2fe; color: #0284c7; padding: 0.4rem 1.2rem; border-radius: 50px; font-size: 0.9rem; font-weight: 700; border: 1px solid #7dd3fc;">
                    <i class="fa-regular fa-calendar-days"></i> ASW Education

            <div class="feedback-card">
                <div class="form-container">
                    <form id="feedbackForm">
                        <div class="form-group">
                            <label for="student-name">Your Name / නම (Optional)</label>
                            <input type="text" id="student-name" class="form-control" placeholder="Enter your name">
                        </div>
                        
                        <div class="form-group">
                            <label>Your Rating / ඔබේ ඇගයීම</label>
                            <div class="rating-wrapper">
                                <div class="rating-container" id="ratingContainer">
                                    <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="Excellent"><i class="fa-solid fa-star"></i></label>
                                    <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="Good"><i class="fa-solid fa-star"></i></label>
                                    <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="Average"><i class="fa-solid fa-star"></i></label>
                                    <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="Poor"><i class="fa-solid fa-star"></i></label>
                                    <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="Very Poor"><i class="fa-solid fa-star"></i></label>
                                </div>
                                <span class="rating-label-text" id="ratingText">Select your rating / ඔබේ තේරීම කරන්න</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="feedback-message">Your Thoughts / ඔබේ අදහස</label>
                            <textarea id="feedback-message" class="form-control" required placeholder="Share your suggestions..."></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-submit">Submit Feedback / අදහස් යොමු කරන්න</button>
                    </form>
                </div>
            </div>
        </div>

    <!-- SCRIPT -->
    <script>
        const backToTopBtn = document.getElementById('backToTopBtn');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });

        // Dynamic Rating Text Description
        const ratingInputs = document.querySelectorAll('input[name="rating"]');
        const ratingText = document.getElementById('ratingText');

        const ratingDescriptions = {
            "5": "⭐⭐⭐⭐⭐ Excellent / ඉතා විශිෂ්ටයි",
            "4": "⭐⭐⭐⭐ Good / හොඳයි",
            "3": "⭐⭐⭐ Average / සාමාන්‍යයි",
            "2": "⭐⭐ Poor / තවත් දියුණු විය යුතුය",
            "1": "⭐ Very Poor / දුර්වලයි"
        };

        ratingInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                ratingText.textContent = ratingDescriptions[e.target.value] || "";
            });
        });

        // --- SUPABASE CONFIGURATION ---
        const _sb = supabase.createClient('https://pelbzkhuxsvmldfqzlkx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlbGJ6a2h1eHN2bWxkZnF6bGt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MjI3NzgsImV4cCI6MjA5NzQ5ODc3OH0.BQ_k-PABq9E52eTRiQ0hqkhRVVA_U_bShTBEofB5lY4');

        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const originalBtnText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting / යවමින් පවතී...";

            const name = document.getElementById('student-name').value.trim();
            const message = document.getElementById('feedback-message').value.trim();
            
            const selectedRatingElement = document.querySelector('input[name="rating"]:checked');
            const rating = selectedRatingElement ? parseInt(selectedRatingElement.value) : null;

            try {
                const { data, error } = await _sb
                    .from('feedback')
                    .insert([
                        { 
                           student_name: name || null,
                           rating: rating, 
                           message: message 
                        }
                    ]);

                if (error) throw error;

                alert('ස්තූතියි! ඔබේ අදහස් සාර්ථකව යොමු කරන ලදී. (Thank you! Your feedback has been submitted.)');
                form.reset();
                ratingText.textContent = "Select your rating / ඔබේ තේරීම කරන්න";
            } catch (error) {
                console.error('Supabase Error:', error);
                alert('Error submitting feedback. Please try again. / යම් දෝෂයක් සිදු වී ඇත. පසුව නැවත උත්සාහ කරන්න.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalBtnText;
            }
        });
    </script>
</body>
