    <style>
        :root {
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --bg: #f0fdf4;
            --card-bg: #ffffff;
            --shadow-base: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        body { 
            font-family: 'Noto Sans Sinhala', sans-serif; 
            background-color: var(--bg); 
            padding: 20px 15px; /* Adjusted for smaller mobile screens */
            display: flex; 
            justify-content: center; 
            margin: 0;
        }
        .container { max-width: 600px; width: 100%; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--green); text-decoration: none; font-weight: 600; }
        .header { margin: 1.5rem 0 1.5rem; text-align: center; }
        h1 { color: #860c57; font-size: 1.8rem; margin-bottom: 0.5rem; } /* Slightly smaller for mobile */
        
        .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.2rem; }
        
        .item {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 20px;
            box-shadow: var(--shadow-base);
            display: block;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 2px solid transparent;
        }
        
        .green-item { color: var(--green); }
        .red-item { color: var(--red); }
        .blue-item { color: var(--blue); }
        
        /* Hover effects remain, will work on touch devices as tap states */
        .item:hover { transform: translateY(-5px) scale(1.01); box-shadow: var(--shadow-hover); }
        .green-item:hover { border-color: var(--green); }
        .red-item:hover { border-color: var(--red); }
        .blue-item:hover { border-color: var(--blue); }

        /* Small screen adjustments */
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .item { padding: 18px; }
        }
    </style>
</head>

<script>
    if ('WebSocket' in window) {
        (function () {
            function refreshCSS() {
                var sheets = [].slice.call(document.getElementsByTagName("link"));
                var head = document.getElementsByTagName("head")[0];
                for (var i = 0; i < sheets.length; ++i) {
                    var elem = sheets[i];
                    var parent = elem.parentElement || head;
                    parent.removeChild(elem);
                    var rel = elem.rel;
                    if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
                        var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
                        elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
                    }
                    parent.appendChild(elem);
                }
            }
            var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
            var address = protocol + window.location.host + window.location.pathname + '/ws';
            var socket = new WebSocket(address);
            socket.onmessage = function (msg) {
                if (msg.data == 'reload') window.location.reload();
                else if (msg.data == 'refreshcss') refreshCSS();
            };
        })();
    }
</script>
