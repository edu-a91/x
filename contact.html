    <script>
        const backToTopBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });
        backToTopBtn.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
        
        // Initialize Supabase Client
        const _sb = supabase.createClient('https://pelbzkhuxsvmldfqzlkx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlbGJ6a2h1eHN2bWxkZnF6bGt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MjI3NzgsImV4cCI6MjA5NzQ5ODc3OH0.BQ_k-PABq9E52eTRiQ0hqkhRVVA_U_bShTBEofB5lY4');
        
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnText = submitBtn.innerText;
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending / යවමින් පවතී...";
            
            const emailVal = document.getElementById('email').value.trim();
            const whatsappVal = document.getElementById('whatsapp').value.trim();
            
            const formData = {
                name: document.getElementById('name').value.trim(),
                email: emailVal === "" ? "Not Provided" : emailVal,
                whatsapp: whatsappVal === "" ? "Not Provided" : whatsappVal,
                message: document.getElementById('message').value.trim()
            };
            
            try {
                const { data, error } = await _sb
                    .from('contact_submissions')
                    .insert([formData]);
                
                if (error) throw error;
                
                alert('Message sent successfully! / පණිවිඩය සාර්ථකව යවන ලදී!');
                document.getElementById('contactForm').reset();
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('Something went wrong. Please try again later. / යම් දෝෂයක් සිදු වී ඇත. පසුව නැවත උත්සාහ කරන්න.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalBtnText;
            }
        });
