    <style>
        /* Base Reset & Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', 'Noto Sans Sinhala', sans-serif;
            background-color: #fffaf5;
            color: #1e293b;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .squircle {
            border-radius: 2.5rem;
        }

        .container {
            max-width: 60rem;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* Navigation Bar */
        nav {
            padding: 1.5rem 0;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: relative;
            z-index: 100;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0f172a;
            text-decoration: none;
        }

        .logo-text span {
            color: #0284c7;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            background: #e0f2fe;
            color: #0284c7;
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.88rem;
            transition: all 0.3s ease;
        }

        .back-home-btn:hover {
            background: #bae6fd;
            transform: translateY(-2px);
        }

        /* Grade 8 Header Hero */
        .grade-hero {
            padding: 4rem 0 2rem 0;
            text-align: center;
        }

        .grade-hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .grade-hero h1 span {
            color: #db2777;
        }

        .grade-hero p {
            font-size: 1.1rem;
            color: #64748b;
            font-family: 'Noto Sans Sinhala', sans-serif;
            font-weight: 600;
        }

        /* Subject Cards Grid Layout */
        .subjects-section {
            padding: 3rem 0 6rem 0;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            max-width: 48rem;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .subjects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .grade-hero h1 {
                font-size: 3.2rem;
            }
        }

        /* Cute Subject Card Theme Styles */
        .subject-card {
            border-width: 3px;
            border-style: solid;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            justify-content: space-between;
        }

        .subject-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.12);
        }

        /* Individual Card Color Themes */
        .card-science {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-color: #bbf7d0;
        }

        .card-math {
            background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
            border-color: #fef08a;
        }

        .subject-icon {
            width: 5rem;
            height: 5rem;
            background: white;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            border: 2px solid rgba(0,0,0,0.03);
            animation: bounceIcon 2s infinite ease-in-out;
        }

        .card-science .subject-icon { color: #16a34a; }
        .card-math .subject-icon { color: #ca8a04; }

        .subject-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            color: #0f172a;
        }

        .subject-subtitle {
            font-size: 1.05rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 1.2rem;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }

        .explore-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.6rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
            margin-top: 1rem;
            text-decoration: none;
        }

        .card-science .explore-btn { background-color: #16a34a; }
        .card-math .explore-btn { background-color: #ca8a04; }

        .explore-btn:hover {
            transform: scale(1.05);
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Responsive adjustments for smaller devices */
        @media (max-width: 480px) {
            .container {
                padding-left: 1rem;
                padding-right: 1.0rem;
            }
            .logo-text {
                font-size: 1.1rem;
            }
            .back-home-btn {
                padding: 0.5rem 0.9rem;
                font-size: 0.78rem;
            }
            .grade-hero {
                padding: 2.5rem 0 1.5rem 0;
            }
            .grade-hero h1 {
                font-size: 1.9rem;
            }
            .grade-hero p {
                font-size: 0.95rem;
            }
            .subjects-section {
                padding: 2rem 0 4rem 0;
            }
            .subject-card {
                padding: 2rem 1.2rem;
            }
            .subject-icon {
                width: 4rem;
                height: 4rem;
                font-size: 1.8rem;
                margin-bottom: 1rem;
            }
            .subject-title {
                font-size: 1.3rem;
            }
            .subject-subtitle {
                font-size: 0.92rem;
            }
            .explore-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
            }
        }
    </style>

        </section>
